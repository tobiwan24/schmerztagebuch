# v3-Web: statische App + Weiterleitung von /api an den Server. Sicherheits-Header wie in `csp.ts` (Test gleicht ab, QA-04).
# Header nur auf Server-Ebene (ein `add_header` in einer location würde sie dort aufheben); Caching per `expires`.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.open-meteo.com https://archive-api.open-meteo.com https://geocoding-api.open-meteo.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=()" always;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # der Server setzt selbst `Cache-Control: no-store` (SYN-09)
  }

  # Service Worker und index.html nie zwischenspeichern (Update-Erkennung, SYN-15); gehashte Assets dauerhaft.
  location = /sw.js {
    expires -1;
  }
  location /assets/ {
    expires max;
  }
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
