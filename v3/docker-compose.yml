# Lokaler Start von Web + Server (Spec 12 „Betrieb"). Produktiv läuft das im Homelab-Repo.
services:
  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    environment:
      RP_ID: ${RP_ID:-localhost}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      DATABASE_PATH: /data/stb.sqlite
      BLOB_DIR: /data/blobs
      PORT: "3000"
      HOST: 0.0.0.0
    volumes:
      - stb-data:/data
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
volumes:
  stb-data:
