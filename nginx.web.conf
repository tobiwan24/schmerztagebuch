# nginx-Konfig für den "web"-Container: liefert die gebaute Vite-PWA
# statisch aus und proxyt /api/* an den api-Container (Single-Origin-Prinzip,
# kein CORS nötig — siehe Architektur-Diagramm in der Spec).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Puffer für base64-Anhänge im Sync-Push (15 MB laut Spec, muss zum
    # Backend-Body-Limit in server/src/config.ts passen).
    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    # Handgeschriebener Service Worker (public/sw.js) unverändert direkt
    # ausliefern, kein SPA-Fallback dafür.
    location = /sw.js {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
